# ===== JWT (Bước 1 - JWT integration) =====
# Secret TỐI THIỂU 32 ký tự, bắt buộc đọc từ biến môi trường JWT_SECRET, không hard-code.
# Gợi ý sinh key: openssl rand -base64 48  (xem .env.example)
# Mặc định rỗng → JwtProperties sẽ ném lỗi lúc khởi động với thông báo rõ ràng.
jwt.secret=${JWT_SECRET:}
# Thời gian sống: access 2 giờ, refresh 7 ngày (refresh code giữ lại cho tương lai).
jwt.access-expiration-ms=7200000
jwt.refresh-expiration-ms=604800000
jwt.issuer=mtbs-user-service
