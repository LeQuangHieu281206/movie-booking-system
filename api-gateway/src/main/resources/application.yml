server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOriginPatterns: "http://localhost:*"
                allowedMethods: "GET,POST,PUT,DELETE,OPTIONS"
                allowedHeaders: "*"
          routes:
            # ---------------- user-service :8084 ----------------
            - id: user-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/getUsers,/api/getUserById,/api/createUser,/api/updateUser,/api/deleteUser

            # ---------------- movie-service :8081 (Movie + Genre + Showtime) ----------------
            - id: movie-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/getMovies,/api/searchMovies,/api/getMovieById,/api/createMovie,/api/updateMovie,/api/deleteMovie,/api/getGenres,/api/getGenreById,/api/createGenre,/api/updateGenre,/api/deleteGenre,/api/getShowtimes,/api/getShowtimeById,/api/getShowtimeSeats,/api/createShowtime,/api/updateShowtime,/api/deleteShowtime

            # ---------------- venue-service :8083 (Cinema + Room + Seat) ----------------
            - id: venue-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/getCinemas,/api/getCinemaById,/api/getCities,/api/getCinemasByCity,/api/createCinema,/api/updateCinema,/api/deleteCinema,/api/getRooms,/api/getRoomById,/api/createRoom,/api/updateRoom,/api/deleteRoom,/api/getSeatsByRoomId,/api/getSeatById,/api/createSeat,/api/updateSeat,/api/deleteSeat

            # ---------------- booking-service :8082 ----------------
            - id: booking-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/getBookings,/api/getBookingById,/api/getBookingsByUserId,/api/getBookingsByShowtimeId,/api/createBooking,/api/updateBooking,/api/deleteBooking

            # ---------------- payment-service :8086 ----------------
            - id: payment-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/createPayment,/api/getPayments/**
