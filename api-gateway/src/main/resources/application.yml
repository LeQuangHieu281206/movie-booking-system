server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOriginPatterns: "http://localhost:*"
                allowedMethods: "GET,POST,PUT,DELETE,OPTIONS"
                allowedHeaders: "*"
          routes:
            # ---------------- user-service :8084 ----------------
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/getUsers,/api/getUserById,/api/createUser,/api/updateUser,/api/deleteUser

            # ---------------- movie-service :8081 (Movie + Genre + Showtime) ----------------
            - id: movie-service
              uri: lb://movie-service
              predicates:
                - Path=/api/getMovies,/api/searchMovies,/api/getMovieById,/api/createMovie,/api/updateMovie,/api/deleteMovie,/api/getGenres,/api/getGenreById,/api/createGenre,/api/updateGenre,/api/deleteGenre,/api/getShowtimes,/api/getShowtimeById,/api/getShowtimeSeats,/api/holdShowtimeSeat,/api/releaseShowtimeSeat,/api/createShowtime,/api/updateShowtime,/api/deleteShowtime

            # ---------------- venue-service :8083 (Cinema + Room + Seat) ----------------
            - id: venue-service
              uri: lb://venue-service
              predicates:
                - Path=/api/getCinemas,/api/getCinemaById,/api/getCities,/api/getCinemasByCity,/api/createCinema,/api/updateCinema,/api/deleteCinema,/api/getRooms,/api/getRoomById,/api/createRoom,/api/updateRoom,/api/deleteRoom,/api/getSeatsByRoomId,/api/getSeatById,/api/createSeat,/api/updateSeat,/api/deleteSeat

            # ---------------- booking-service :8082 ----------------
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/getBookings,/api/getBookingById,/api/getBookingsByUserId,/api/getBookingsByShowtimeId,/api/getBookingStats,/api/createBooking,/api/updateBooking,/api/deleteBooking

            # ---------------- payment-service :8086 ----------------
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/createPayment,/api/getPayments/**,/api/sepayWebhook

gateway:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: mtbs-user-service
    internal-token: ${INTERNAL_TOKEN:}

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
